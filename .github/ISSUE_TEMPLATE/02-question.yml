name: Question
description: Ask a question
title: "[Question] <Please write a comprehensive title after the '[Question]' prefix>"
labels: [question]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      description: >
        To help keep this issue tracker clean and focused, please make sure that you have
         tried **all** of the following resources before submitting your question.
      options:
        - label: I searched the [documentation](https://test_project.readthedocs.io).
          required: true
        - label: I looked for [similar existing or closed as "not planned" issues](https://github.com/pyfar/test_project/issues?q=is%3Aissue+%28is%3Aopen+OR+reason%3Anot-planned%29).
          required: true
        - label: I looked up my question/problem in a search engine.
          required: true

  - type: textarea
    attributes:
      label: Question
      description: Please ask your question.
    validations:
      required: true
